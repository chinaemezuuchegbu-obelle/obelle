[project]
name = "obelle-worker"
version = "0.1.0"
description = "Headless WebRTC AI Copilot & GraphRAG Worker for Obelle"
requires-python = ">=3.11"
dependencies = [
    "livekit==1.2.0",
    "livekit-agents==1.8.11",
    "livekit-plugins-deepgram>=0.7.0",
    "livekit-plugins-elevenlabs>=0.7.0",
    "livekit-plugins-openai>=0.8.0",
    "livekit-plugins-groq==1.8.11",
    "livekit-plugins-silero>=0.7.0",
    "neo4j>=5.27.0",
    "neo4j-graphrag>=1.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
